<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16181d" />
  <title>Autenticador 2FA</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Autenticador 2FA</h1>
  </header>

  <main id="account-list" class="account-list">
    <p class="empty-state" id="empty-state">Nenhuma conta ainda. Toque em "+" para escanear um QR code.</p>
  </main>

  <p id="status-live" class="sr-only" role="status" aria-live="polite"></p>

  <button id="btn-add" class="fab" aria-label="Adicionar conta">+</button>

  <div id="toast" class="toast" hidden></div>

  <dialog id="scan-dialog" class="scan-dialog">
    <div class="scan-box">
      <video id="scan-video" playsinline muted></video>
      <canvas id="scan-canvas" hidden></canvas>
      <p id="scan-error" class="scan-error" hidden></p>
      <button type="button" id="btn-manual-entry" class="btn-link">Inserir chave manualmente</button>
      <button id="btn-cancel-scan" class="btn-secondary">Cancelar</button>
    </div>
  </dialog>

  <dialog id="manual-dialog" class="confirm-dialog">
    <form id="manual-form">
      <h2>Inserir manualmente</h2>
      <label class="field">
        <span>Chave secreta</span>
        <input type="text" id="manual-secret" required autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ex: WW4I XMG4 OGMM 5GGH" />
      </label>
      <label class="field">
        <span>Conta</span>
        <input type="text" id="manual-account" required autocomplete="off" placeholder="ex: usuario@email.com" />
      </label>
      <label class="field">
        <span>Emissor (opcional)</span>
        <input type="text" id="manual-issuer" autocomplete="off" placeholder="ex: Google" />
      </label>
      <details class="manual-advanced">
        <summary>Opções avançadas</summary>
        <div class="manual-advanced-grid">
          <label class="field-inline">
            <span>Dígitos</span>
            <select id="manual-digits">
              <option value="6" selected>6</option>
              <option value="8">8</option>
            </select>
          </label>
          <label class="field-inline">
            <span>Período (s)</span>
            <input type="number" id="manual-period" value="30" min="10" max="120" />
          </label>
          <label class="field-inline">
            <span>Algoritmo</span>
            <select id="manual-algorithm">
              <option value="SHA1" selected>SHA1</option>
              <option value="SHA256">SHA256</option>
              <option value="SHA512">SHA512</option>
            </select>
          </label>
        </div>
      </details>
      <p id="manual-error" class="scan-error" hidden></p>
      <div class="confirm-actions">
        <button type="button" id="btn-cancel-manual" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary">Adicionar</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="confirm-dialog">
    <form id="confirm-form">
      <h2>Adicionar conta</h2>
      <p><strong id="confirm-issuer"></strong></p>
      <p id="confirm-account"></p>
      <div class="confirm-actions">
        <button type="button" id="btn-cancel-confirm" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary">Adicionar</button>
      </div>
    </form>
  </dialog>

  <script src="js/jsQR.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
